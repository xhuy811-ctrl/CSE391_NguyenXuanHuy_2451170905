<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bố cục Flexbox</title>
  <link rel="stylesheet" href="flexbox.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar__logo">LOGO</div>
    <nav class="navbar__menu" aria-label="Main menu">
      <a href="#">Trang chủ</a>
      <a href="#">Sản phẩm</a>
      <a href="#">Giới thiệu</a>
    </nav>
    <div class="navbar__actions">
      <button class="btn btn--ghost" type="button">Đăng nhập</button>
      <button class="btn btn--primary" type="button">Đăng ký</button>
    </div>
  </header>

  <main class="products-section">
    <h1>Sản phẩm của chúng tôi</h1>
    <div class="product-grid">
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1513708925098-4b03b0290c78?auto=format&fit=crop&w=800&q=80" alt="Đồng hồ thông minh" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Đồng hồ thông minh</h2>
            <p class="product-card__price">$149</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=800&q=80" alt="Tai nghe" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Tai nghe</h2>
            <p class="product-card__price">$89</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1560185127-6b6ba0b9adfc?auto=format&fit=crop&w=800&q=80" alt="Balo" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Balo</h2>
            <p class="product-card__price">$69</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1512499617640-c2f999ef4f56?auto=format&fit=crop&w=800&q=80" alt="Giày thể thao" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Giày thể thao</h2>
            <p class="product-card__price">$129</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=800&q=80" alt="Máy ảnh" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Máy ảnh</h2>
            <p class="product-card__price">$249</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=800&q=80" alt="Kính râm" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Kính râm</h2>
            <p class="product-card__price">$59</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=800&q=80" alt="Ví" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Ví</h2>
            <p class="product-card__price">$39</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
      <article class="product-card">
          <img class="product-card__image" src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80" alt="Đèn bàn" />
        <div class="product-card__body">
          <div class="product-card__meta">
            <h2 class="product-card__title">Đèn bàn</h2>
            <p class="product-card__price">$49</p>
          </div>
          <button class="btn btn--buy" type="button">Mua</button>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
