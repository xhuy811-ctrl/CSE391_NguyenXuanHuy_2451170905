```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - E-Commerce</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; background-color: #f9f9f9; }
        form { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        fieldset { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        legend { font-weight: bold; padding: 0 10px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="password"], select, textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .radio-group { display: flex; gap: 15px; align-items: center; }
        .radio-group input { margin-right: 5px; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; }
        .checkbox-group input { margin-top: 5px; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button[type="submit"] { background-color: #28a745; color: white; }
        button[type="reset"] { background-color: #dc3545; color: white; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <form action="#" method="POST">
        <h1>Đăng ký tài khoản</h1>

        <!-- Fieldset 1: Thông tin cá nhân -->
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <div class="form-group">
                <label for="fullname">Họ tên:</label>
                <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50" placeholder="Nhập họ và tên đầy đủ">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Nhập 10 chữ số">
            </div>
            <div class="form-group">
                <label for="dob">Ngày sinh:</label>
                <!-- Max ngày hiện tại 2026-05-03 -->
                <input type="date" id="dob" name="dob" max="2026-05-03" required>
            </div>
            <div class="form-group">
                <label>Giới tính:</label>
                <div class="radio-group">
                    <input type="radio" id="gender-m" name="gender" value="male" checked>
                    <label for="gender-m">Nam</label>
                    <input type="radio" id="gender-f" name="gender" value="female">
                    <label for="gender-f">Nữ</label>
                    <input type="radio" id="gender-o" name="gender" value="other">
                    <label for="gender-o">Khác</label>
                </div>
            </div>
        </fieldset>

        <!-- Fieldset 2: Tài khoản -->
        <fieldset>
            <legend>Tài khoản</legend>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" pattern="[A-Za-z0-9_]{3,20}" required placeholder="Chữ cái, số hoặc dấu gạch dưới">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password" minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" required placeholder="Ít nhất 8 ký tự, 1 hoa, 1 số">
            </div>
            <div class="form-group">
                <label for="confirm-password">Xác nhận mật khẩu:</label>
                <input type="password" id="confirm-password" name="confirm-password" minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" required placeholder="Nhập lại mật khẩu giống bên trên">
            </div>
        </fieldset>

        <!-- Fieldset 3: Thông tin giao hàng -->
        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <div class="form-group">
                <label for="city">Thành phố:</label>
                <select id="city" name="city" required>
                    <option value="">-- Chọn thành phố --</option>
                    <option value="hanoi">Hà Nội</option>
                    <option value="hcm">TP. Hồ Chí Minh</option>
                    <option value="danang">Đà Nẵng</option>
                    <option value="cantho">Cần Thơ</option>
                    <option value="haiphong">Hải Phòng</option>
                </select>
            </div>
            <div class="form-group">
                <label for="district">Quận/Huyện:</label>
                <select id="district" name="district" required>
                    <option value="">-- Chọn Quận/Huyện --</option>
                    <option value="q1">Quận 1 / Ba Đình</option>
                    <option value="q2">Quận 2 / Hoàn Kiếm</option>
                    <option value="q3">Quận 3 / Đống Đa</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address">Địa chỉ chi tiết:</label>
                <textarea id="address" name="address" rows="3" placeholder="Số nhà, tên đường, phường/xã..."></textarea>
            </div>
        </fieldset>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">Tôi đồng ý với các điều khoản và chính sách bảo mật của hệ thống.</label>
        </div>

        <div class="btn-group">
            <button type="submit">Đăng ký ngay</button>
            <button type="reset">Làm lại</button>
        </div>
    </form>

</body>
</html>
